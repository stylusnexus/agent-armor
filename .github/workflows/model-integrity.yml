# Model integrity: confirms MODEL_CHECKSUM and LABELS in packages/ml still
# agree with the artifacts actually hosted on HuggingFace.
#
# The checksum is maintained by hand during the model-update lifecycle
# (retrain -> export -> update constant -> push to HF -> publish npm). Nothing
# used to close that loop, so drift was discovered by end users hitting
# CHECKSUM_MISMATCH on first download. This runs weekly instead.
#
# Needs no secrets: the HuggingFace repo is public and this is read-only.
name: model-integrity

on:
  schedule:
    # Mondays 06:00 UTC — a mismatch surfaces within a week of appearing.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      deep:
        description: 'Download and hash the full model instead of trusting HuggingFace LFS metadata'
        type: boolean
        default: false
  # Also run when the constants or the check itself change, so a bad checksum
  # is caught in review rather than by the following Monday's schedule.
  pull_request:
    branches: [main, dev]
    paths:
      - 'packages/ml/src/constants.ts'
      - 'packages/ml/src/tokenizer.ts'
      - 'packages/ml/scripts/**'
      - 'packages/ml/__tests__/fixtures/**'
      - 'packages/ml/package.json'
      - 'packages/ml/package-lock.json'
      - '.github/workflows/model-integrity.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/ml/package-lock.json
      - run: npm ci
      - name: Verify hosted model matches shipped constants
        run: npm run ${{ inputs.deep && 'check:model:deep' || 'check:model' }}
      # #271: the tokenizer must give the ids the Python training tokenizer gives,
      # and the real model must tell an attack from an honest sentence. Both run
      # against the files hosted on HuggingFace, so drift in the hosted
      # tokenizer.json (or in the `tokenizers` package) fails here.
      - name: Download hosted model files
        run: |
          mkdir -p "$RUNNER_TEMP/model"
          # The revision the package downloads from (HF_REVISION in constants.ts).
          rev=$(sed -n "s/^export const HF_REVISION = '\(.*\)';/\1/p" src/constants.ts)
          test -n "$rev"
          for f in model_quantized.onnx tokenizer.json label_map.json; do
            curl -fL --retry 3 -o "$RUNNER_TEMP/model/$f" \
              "https://huggingface.co/stylusnexus/agent-armor-classifier/resolve/$rev/$f"
          done
      - name: Tokenizer golden ids and model end to end
        env:
          MODEL_DIR: ${{ runner.temp }}/model
          TOKENIZER_JSON: ${{ runner.temp }}/model/tokenizer.json
          REQUIRE_TOKENIZER_GOLDEN: '1'
          REQUIRE_MODEL_E2E: '1'
        run: npx vitest run __tests__/tokenizer-golden.test.ts __tests__/model-e2e.test.ts
