# Eval gate: protects the fast-moving organs (patterns, detector thresholds,
# defaults) that ship through a different door than feature code. A loosened
# regex or nudged threshold that drops detection or raises the false-positive
# rate fails here instead of shipping quietly. Runs on every PR — a regression
# can originate anywhere, so the gate is not path-filtered.
#
# - typecheck:       the Constraint organ (src/, code-review-protected)
# - typecheck:eval:  type-check the eval scripts themselves (tsx skips this)
# - test:run:        unit tests (the Verification organ)
# - eval:gate:       the detection-quality regression gate (thresholds.json)
# - eval:multi-turn: the stateful blind-spot harness (#35); fails on a benign
#                    false positive or any sample sliding below its committed
#                    expectedToday prediction, otherwise informational
name: eval

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  # release-please commits are created with GITHUB_TOKEN, so they do not
  # trigger push or pull_request workflows. release-please.yml explicitly
  # dispatches this workflow on each release PR head instead.
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full expected release PR head SHA
        required: true
        type: string
      pull_request_number:
        description: Release PR number to validate against this run
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-release-dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Confirm dispatched run matches an open release PR head
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          pull=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          test "$(jq -r 'select(.state == "open" and .base.ref == "main" and (.head.ref | startswith("release-please--branches--main")) and (.user.login == "app/github-actions" or .user.login == "github-actions[bot]")) | .number' <<<"$pull")" = "$PR_NUMBER"
          test "$(jq -r '.head.sha' <<<"$pull")" = "$EXPECTED_SHA"

  eval:
    needs: validate-release-dispatch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if release PR validation did not pass
        if: github.event_name == 'workflow_dispatch' && needs.validate-release-dispatch.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:eval
      - run: npm run test:run
      - run: npm run eval:gate
      - run: npm run eval:multi-turn
